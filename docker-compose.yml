version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - mongo

    restart: unless-stopped

  mongo:
    image: mongo:6

    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: 123456

    volumes:
      - mongo_data:/data/db

    # SOLO para desarrollo
    ports:
      - "27017:27017"

volumes:
  mongo_data: