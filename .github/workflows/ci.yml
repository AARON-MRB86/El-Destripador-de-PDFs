name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6
        ports: [27017]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Debug environment
        run: |
          echo "--- Python & pip ---"
          python -V || true
          pip --version || true
          echo "--- pip freeze ---"
          pip freeze || true
          echo "--- Python executable & platform ---"
          python -c "import sys,platform; print(sys.executable); print(platform.platform())" || true
          echo "--- ls repo root ---"
          ls -la || true
          echo "--- env keys (redacted by Actions if secrets) ---"
          env | sort || true
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt || true
          # Install project plus optional 'dev' extras so CI has pytest and test utilities
          pip install -e '.[dev]'
      - name: Run tests
        env:
          DATABASE_URL: mongodb://localhost:27017
          DATABASE_NAME: test_db
        run: |
          python -m pytest -vv

  build-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: el-destripador-pdfs:latest
